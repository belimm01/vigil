name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/vigil
      - run: helm template vigil deploy/helm/vigil > /tmp/vigil.yaml
      - run: docker build --target api -t vigil-api:test .
      - run: docker build --target worker -t vigil-worker:test .
      - run: docker build --target web -t vigil-web:test .
