api:
  replicas: 2
  image: {repository: ghcr.io/belimm01/vigil-api, tag: "0.1.0", pullPolicy: IfNotPresent}
worker:
  replicas: 1
  image: {repository: ghcr.io/belimm01/vigil-worker, tag: "0.1.0", pullPolicy: IfNotPresent}
  concurrency: 10
web:
  replicas: 2
  image: {repository: ghcr.io/belimm01/vigil-web, tag: "0.1.0", pullPolicy: IfNotPresent}
secret:
  existingSecret: vigil-runtime
  databaseURLKey: database-url
  jwtSecretKey: jwt-secret
resources:
  api:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  worker:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
  web:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}
service:
  type: ClusterIP
  port: 80
