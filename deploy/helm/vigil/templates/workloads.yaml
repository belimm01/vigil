apiVersion: v1
kind: ConfigMap
metadata: {name: {{ include "vigil.fullname" . }}-nginx}
data:
  default.conf: |
    {{- include "vigil.nginxConfig" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vigil.fullname" . }}-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
  template:
    metadata:
      labels:
        {{- include "vigil.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}@{{ .Values.api.image.digest }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports: [{name: http, containerPort: 4000}]
          env:
            - {name: NODE_ENV, value: production}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.secret.existingSecret }}, key: {{ .Values.secret.databaseURLKey }}}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: {{ .Values.secret.existingSecret }}, key: {{ .Values.secret.jwtSecretKey }}}}
          startupProbe: {httpGet: {path: /api/health/live, port: http}, periodSeconds: 5, failureThreshold: 24}
          readinessProbe: {httpGet: {path: /api/health/ready, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/health/live, port: http}, periodSeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: {name: {{ include "vigil.fullname" . }}-api}
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
  ports: [{name: http, port: 4000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ include "vigil.fullname" . }}-worker}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: worker}
  template:
    metadata:
      labels:
        {{- include "vigil.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}@{{ .Values.worker.image.digest }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          ports: [{name: health, containerPort: 4001}]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.secret.existingSecret }}, key: {{ .Values.secret.databaseURLKey }}}}
            - {name: CHECK_CONCURRENCY, value: {{ .Values.worker.concurrency | quote }}}
            {{- if .Values.smtp.enabled }}
            - name: SMTP_HOST
              valueFrom: {secretKeyRef: {name: {{ .Values.smtp.existingSecret }}, key: {{ .Values.smtp.hostKey }}}}
            - name: SMTP_PORT
              valueFrom: {secretKeyRef: {name: {{ .Values.smtp.existingSecret }}, key: {{ .Values.smtp.portKey }}}}
            - name: SMTP_USER
              valueFrom: {secretKeyRef: {name: {{ .Values.smtp.existingSecret }}, key: {{ .Values.smtp.userKey }}}}
            - name: SMTP_PASS
              valueFrom: {secretKeyRef: {name: {{ .Values.smtp.existingSecret }}, key: {{ .Values.smtp.passwordKey }}}}
            - name: SMTP_FROM
              valueFrom: {secretKeyRef: {name: {{ .Values.smtp.existingSecret }}, key: {{ .Values.smtp.fromKey }}}}
            {{- end }}
          startupProbe: {httpGet: {path: /health/live, port: health}, periodSeconds: 5, failureThreshold: 12}
          readinessProbe: {httpGet: {path: /health/ready, port: health}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health/live, port: health}, periodSeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ include "vigil.fullname" . }}-web}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web}
  template:
    metadata:
      annotations:
        checksum/nginx-config: {{ include "vigil.nginxConfig" . | sha256sum }}
      labels:
        {{- include "vigil.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}@{{ .Values.web.image.digest }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /, port: http}}
          livenessProbe: {httpGet: {path: /, port: http}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            {{- toYaml .Values.resources.web | nindent 12 }}
          volumeMounts:
            - {name: nginx, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
      volumes:
        - name: nginx
          configMap: {name: {{ include "vigil.fullname" . }}-nginx}
---
apiVersion: v1
kind: Service
metadata: {name: {{ include "vigil.fullname" . }}}
spec:
  type: {{ .Values.service.type }}
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web}
  ports: [{name: http, port: {{ .Values.service.port }}, targetPort: http}]
